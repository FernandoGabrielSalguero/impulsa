<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{{title}}</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f6fb; color: #18202f; font-family: Arial, sans-serif; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
    .card { background: #ffffff; border-radius: 14px; padding: 28px; border: 1px solid #dde3ef; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0 0 16px; line-height: 1.5; }
    .credentials { background: #f7f9fe; border: 1px solid #dde3ef; border-radius: 10px; padding: 16px; margin: 20px 0; }
    .credentials p { margin: 0 0 8px; }
    .button { display: inline-block; padding: 12px 18px; background: #1f5eff; color: #ffffff !important; text-decoration: none; border-radius: 8px; font-weight: 700; }
    .muted { color: #667085; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Tu acceso a Impulsa</h1>
      <p>Hola {{nombre}}, creamos tu usuario para que puedas ingresar al panel y seguir el avance de tu proyecto.</p>
      <div class="credentials">
        <p><strong>Usuario:</strong> {{correo}}</p>
        <p><strong>Contrasena:</strong> {{password}}</p>
      </div>
      <p><a class="button" href="{{link}}">Ingresar</a></p>
      <p class="muted">Link de acceso: {{link}}</p>
      <p class="muted">Por seguridad, conserva estas credenciales en un lugar privado.</p>
    </div>
  </div>
</body>
</html>
